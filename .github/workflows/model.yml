name: Model

# Manual run
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train:
    name: Retrain + export model artifacts
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg      # predictor.py calls plt.show(); keep it headless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ML deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn torch matplotlib
      - name: Predict / train / quantize / export
        run: |
          python ml/predictor.py --glob "datasets/memory_leak_*.csv"
          python ml/train_ae.py
          python ml/quantize.py
          python ml/export_model.py
      - name: Commit regenerated artifacts
        run: |
          git config user.name  "CristiM"
          git config user.email "maiorcristian123@gmail.com"
          git add -f ml/artifacts firmware/common/ae_model.h
          if git diff --cached --quiet; then
            echo "no artifact changes"; exit 0
          fi
          git commit -m "[CHORE] Regenerate model artifacts"
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase origin/main && git push origin HEAD:main && break
            git rebase --abort 2>/dev/null || true
            sleep 5
          done