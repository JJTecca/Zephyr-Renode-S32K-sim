name: CI
permissions:
      contents: read
      pull-requests: write

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'sim/**'
      - 'tests/renode/**'
      - 'west.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'sim/**'
      - 'tests/renode/**'
      - 'west.yml'
      - '.github/workflows/ci.yml'

# Cancel an in-progress CI run when a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build firmware (mr_canhubk3/s32k344)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout into a workspace subdir
        uses: actions/checkout@v4
        with:
          path: Zephyr-Renode-S32K-sim

      - name: Set up Zephyr + west + SDK (auto-matches SDK_VERSION)
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: Zephyr-Renode-S32K-sim
          toolchains: arm-zephyr-eabi

      - name: Build K1 edge
        run: west build -b mr_canhubk3/s32k344 Zephyr-Renode-S32K-sim/firmware/k1_edge -d build/k1_powertrain

      - name: Build K3 hub
        run: west build -b mr_canhubk3/s32k344 Zephyr-Renode-S32K-sim/firmware/k3_hub -d build/k3_hub

      - name: Upload ELFs
        uses: actions/upload-artifact@v4
        with:
          name: elfs
          retention-days: 7
          path: |
            build/k1_powertrain/zephyr/zephyr.elf
            build/k3_hub/zephyr/zephyr.elf

  simulate:
    name: Renode smoke + fault test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch built ELFs
        uses: actions/download-artifact@v4
        with:
          name: elfs
          path: build

      - name: Run Renode Robot tests
        uses: antmicro/renode-test-action@v5
        with:
          tests-to-run: tests/renode/k1_uart.robot
          artifacts-path: renode-artifacts

      - name: Upload Renode logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renode-logs
          retention-days: 7
          path: renode-artifacts

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pandas scikit-learn torch ruff
      - run: ruff check ml sim
