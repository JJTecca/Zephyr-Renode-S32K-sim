name: "Enforce PR Title Convention"

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  check-title-format:
    name: "Check PR Title Format"
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title format
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^\[(FEATURE|BUG|HOTFIX|DOCS|REFACTOR|TEST|CHORE)\]\s.+/i;

            if (!pattern.test(title)) {
              core.setFailed(
                `❌ Invalid PR title format: "${title}".\n` +
                `Title must start with one of [FEATURE], [BUG], [HOTFIX], [DOCS], [REFACTOR], [TEST], or [CHORE].`
              );
            } else {
              console.log(`✅ Valid PR title format: "${title}"`);
            }

  check-title-length:
    name: "Check PR Title Length"
    runs-on: ubuntu-latest
    needs: check-title-format
    steps:
      - name: Validate PR title length
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const maxLength = 40;

            if (title.length > maxLength) {
              core.setFailed(
                `❌ PR title too long (${title.length} chars).\n` +
                `Title must be at most ${maxLength} characters long.`
              );
            } else {
              console.log(`✅ PR title length OK (${title.length} chars).`);
            }
